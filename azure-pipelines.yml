# CI — valida toda alteração sem tocar em produção. Obrigatório para aprovar PR.
trigger:
  branches:
    include: [main]
pr:
  branches:
    include: [main]

# Agente self-hosted (pool Default) enquanto o free-parallelism Microsoft-hosted
# não é concedido. Quando o grant sair, voltar para: vmImage: ubuntu-latest.
pool:
  name: Default

variables:
  # Valor dummy para os passos que só precisam da variável existir (prisma
  # generate, next build) e valor real para o migration check, que sobe um
  # Postgres descartável nesta URL. Definida UMA vez, aqui: quando existia uma
  # cópia no `env:` do passo, a variável de pipeline venceu e o migration check
  # publicou a porta errada.
  #
  # Porta 55432, não a 5432: o agente é self-hosted e a mesma máquina roda o
  # Postgres de desenvolvimento na 5432 (docs/CI.md).
  DATABASE_URL: "postgresql://ci:ci@localhost:55432/ci?schema=public"

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: "20.x"
    displayName: "Node 20"

  - script: npm ci
    displayName: "Instalar dependências (npm ci)"

  # Baseline do ambiente do agente self-hosted (ADR-002). Registra as versões
  # das ferramentas no log de cada build — âncora auditável para reproduzir/
  # diagnosticar o CI. npx prisma roda após npm ci (usa o binário local).
  # powershell (Windows PowerShell 5.1, não script/cmd nem pwsh Core): o agente
  # é Windows e cmd.exe encerra o batch ao chamar npm.cmd/npx.cmd sem `call`,
  # engolindo git/docker/prisma. PowerShell executa cada linha isolada,
  # garantindo as 5 versões no log. Usar powershell: (pwsh Core não instalado).
  - powershell: |
      Write-Host "=== Ambiente do agente (baseline) ==="
      node --version
      npm --version
      git --version
      docker --version
      npx prisma --version
    displayName: "Diagnóstico do ambiente"

  # Validação do IaC: garante que nenhum Bicep inválido chegue à main. Compila
  # o template raiz (que puxa todos os módulos) e cada arquivo de parâmetros.
  # $ErrorActionPreference/exit garantem que qualquer erro reprove o build.
  - powershell: |
      $ErrorActionPreference = "Stop"
      az bicep build --file infra/bicep/main.bicep --stdout > $null
      if ($LASTEXITCODE -ne 0) { exit 1 }
      Get-ChildItem infra/bicep/environments -Filter *.bicepparam | ForEach-Object {
        az bicep build-params --file $_.FullName --stdout > $null
        if ($LASTEXITCODE -ne 0) { exit 1 }
      }
      Write-Host "Bicep valido."
    displayName: "Validar Bicep (az bicep build)"
    env:
      # build-params lê estas variáveis (readEnvironmentVariable). Valores dummy:
      # a validação só compila, não implanta nada.
      GPOL_PG_PASSWORD: "dummy"
      GPOL_DB_URL: "dummy"
      GPOL_AUTH_SECRET: "dummy"
      GPOL_AAD_CLIENT_SECRET: "dummy"
      GPOL_STORAGE_CONN: "dummy"
      GPOL_OPENAI_KEY: "dummy"
      GPOL_ACR_PASSWORD: "dummy"
      GPOL_CRON_SECRET: "dummy"

  - script: npx prisma generate
    displayName: "Prisma generate"

  # Regra 4 do DEPLOY.md: valida que todas as migrações aplicam sem erro num
  # banco descartável antes de o PR entrar em main.
  # DATABASE_URL vem das variables do pipeline (topo do arquivo) — sem cópia
  # aqui: a variável de pipeline vence o `env:` do passo, então uma segunda
  # definição só cria divergência silenciosa.
  - powershell: scripts/ci/migration-check.ps1
    displayName: "Migration check (banco descartavel)"

  - script: npx tsc --noEmit
    displayName: "TypeScript (tsc --noEmit)"

  - script: npm run lint
    displayName: "Lint (ESLint)"
    continueOnError: true

  - script: npm test
    displayName: "Testes (Vitest)"

  - script: npm run build
    displayName: "Build Next.js"

  - script: docker build -t gpoliticas:$(Build.BuildId) .
    displayName: "Build da imagem Docker"

  # CD — só em push de verdade em main (nunca em validação de PR). Reusa a
  # mesma logica do scripts/deploy.ps1 manual, so trocando o numero de versao
  # manual (vN) pelo Build.BuildId (sempre unico e rastreavel ao build).
  # Requer a service connection "gpol-deploy-rg-gpoliticas" (ARM, escopo
  # rg-gpoliticas) - criada manualmente em Project Settings > Service
  # connections (o agente Claude nao pode criar isso: classificador da
  # ferramenta bloqueia criacao de service principal/concessao de acesso).
  - task: AzureCLI@2
    displayName: "Push para ACR + deploy no Container App"
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    inputs:
      azureSubscription: "gpol-deploy-rg-gpoliticas"
      scriptType: ps
      scriptLocation: inlineScript
      inlineScript: |
        $ErrorActionPreference = "Stop"
        az acr login --name acrgpolhml27207f
        docker tag gpoliticas:$(Build.BuildId) acrgpolhml27207f.azurecr.io/gpoliticas:$(Build.BuildId)
        docker push acrgpolhml27207f.azurecr.io/gpoliticas:$(Build.BuildId)
        az containerapp update --name ca-gpol-hml-aahbrant --resource-group rg-gpoliticas `
          --image acrgpolhml27207f.azurecr.io/gpoliticas:$(Build.BuildId)
        az containerapp job update --name caj-gpol-hml-lembretes --resource-group rg-gpoliticas `
          --image acrgpolhml27207f.azurecr.io/gpoliticas:$(Build.BuildId)
